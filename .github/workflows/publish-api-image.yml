name: Publish API image

# Builds the API container image and pushes it to GitHub Container Registry
# (ghcr.io/<owner>/tfl-analytics-api). The Container App pulls this image instead
# of Azure Container Registry — see docs/ghcr-image-migration.md.
#
# One-time after the first successful run: mark the `tfl-analytics-api` package
# Public (repo → Packages → package settings) so the Container App can pull it
# anonymously (no registry credentials configured on the app).

on:
  push:
    branches: [main]
    paths:
      - 'src/TflAnalytics.Api/**'
      - 'src/TflAnalytics.Application/**'
      - 'src/TflAnalytics.Contracts/**'
      - 'src/TflAnalytics.Infrastructure/**'
      - 'TflAnalytics.sln'
      - '.github/workflows/publish-api-image.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/tfl-analytics-api
    steps:
      - uses: actions/checkout@v5

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: src/TflAnalytics.Api/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
